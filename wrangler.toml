#:schema node_modules/wrangler/config-schema.json
name = "corpse-club"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_als"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Secrets (set with `npx wrangler pages secret put <NAME>`, or in .dev.vars locally):
#   VAPID_PRIVATE_KEY  base64url private scalar from `npm run vapid`

[vars]
VAPID_PUBLIC_KEY = "BMs-57KUdOzOVmiL5USCsvEU-70suTwET5hKrH199jjx8HYcJ-hV10Ab1y5de-k-6VoJb1L8qvgTcU6FsZdvagY"
VAPID_SUBJECT = "mailto:summon@corpse.club"

[[d1_databases]]
binding = "DB"
database_name = "corpse-club"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "corpse-club-images"
